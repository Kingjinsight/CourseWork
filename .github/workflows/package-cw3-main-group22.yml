name: Package CW3 Main Submission Group 22

on:
  workflow_dispatch:
  push:
    paths:
      - "CW3/pom.xml"
      - "CW3/src/assembly/se-implementation.xml"
      - "CW3/src/main/java/**"
      - "CW3/src/main/resources/**"
      - "CW3/src/test/java/**"
      - ".github/workflows/package-cw3-main-group22.yml"

permissions:
  contents: read

jobs:
  package-main:
    if: github.repository == 'Inf2-SEPP-CW-2026/CourseWork'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run CW3 tests
        run: mvn -q -f CW3/pom.xml test

      - name: Build CW3 main submission ZIP
        run: mvn -q -f CW3/pom.xml -Pse-implementation-zip package

      - name: Upload CW3 main submission artifact
        uses: actions/upload-artifact@v4
        with:
          name: CW3SEImplementationGroup22
          path: CW3/target/CW3SEImplementationGroup22.zip
          if-no-files-found: error
